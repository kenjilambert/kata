<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kata</title>
<meta name="description" content="Kata: estúdio de padrões geométricos procedurais. Gere azulejos, mosaicos, gradientes e padrões reativos a som e vídeo, e exporte em SVG, PNG ou pattern pro Illustrator." />
<meta name="theme-color" content="#0a0a0a" />
<meta name="color-scheme" content="dark" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Kata" />
<meta property="og:title" content="Kata" />
<meta property="og:description" content="Estúdio de padrões geométricos procedurais: azulejos, mosaicos, gradientes e padrões reativos a som e vídeo, exportáveis em SVG/PNG." />
<meta property="og:url" content="https://kata.kenjilambert.com/" />
<meta property="og:locale" content="pt_BR" />
<meta property="og:locale:alternate" content="en_US" />
<meta name="twitter:card" content="summary" />
<link rel="canonical" href="https://kata.kenjilambert.com/" />
<!-- href real é setado em main.js (mesmo ícone gerado dinamicamente do
     header, com seed nova a cada carregamento — ver ui/dynamicLogo.js) —
     isso aqui é só o placeholder pro browser não tentar buscar um
     /favicon.ico que não existe antes do JS rodar. -->
<link id="favicon" rel="icon" type="image/svg+xml" href="" />
<!-- fonte auto-hospedada (ver @font-face no topo de style.css) — pré-carregada
     pra não esperar o CSS baixar+parsear antes de descobrir que precisa dela.
     Só o arquivo latin (cobre todo o pt-BR); latin-ext só desce se um
     caractere pedir. -->
<link rel="preload" href="./fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="./src/style.css" />
<!-- modulepreload da cadeia de imports da PRIMEIRA aba (Azulejo) + casca.
     Sem bundler, o navegador só descobre cada import depois de baixar e
     parsear o arquivo que o importa — 4 "degraus" de rede em série. Com a
     lista aqui, tudo dispara em paralelo já no HTML. Os outros módulos
     (Mosaico/Gradiente/Som/Espelho) NÃO entram: são import() sob demanda
     (ver MODULES em main.js). Lista gerada a partir do grafo estático de
     imports — se um arquivo novo entrar na cadeia do Azulejo, adicionar
     aqui (não é obrigatório, só deixa de ganhar o paralelismo). -->
<link rel="modulepreload" href="./src/core/clipboard-input.js" />
<link rel="modulepreload" href="./src/core/color.js" />
<link rel="modulepreload" href="./src/core/export.js" />
<link rel="modulepreload" href="./src/core/i18n.js" />
<link rel="modulepreload" href="./src/core/imagePalette.js" />
<link rel="modulepreload" href="./src/core/imageSampling.js" />
<link rel="modulepreload" href="./src/core/palette.js" />
<link rel="modulepreload" href="./src/core/patternState.js" />
<link rel="modulepreload" href="./src/core/seed.js" />
<link rel="modulepreload" href="./src/core/symmetry.js" />
<link rel="modulepreload" href="./src/core/textures.js" />
<link rel="modulepreload" href="./src/core/themes.js" />
<link rel="modulepreload" href="./src/modules/grid-icons/generator.js" />
<link rel="modulepreload" href="./src/modules/grid-icons/index.js" />
<link rel="modulepreload" href="./src/modules/grid-icons/shapes.js" />
<link rel="modulepreload" href="./src/modules/grid-icons/svgVectorShape.js" />
<link rel="modulepreload" href="./src/ui/categoryIcons.js" />
<link rel="modulepreload" href="./src/ui/controls/button.js" />
<link rel="modulepreload" href="./src/ui/controls/colorSwatches.js" />
<link rel="modulepreload" href="./src/ui/controls/frameTilePicker.js" />
<link rel="modulepreload" href="./src/ui/controls/iconSelect.js" />
<link rel="modulepreload" href="./src/ui/controls/pressButton.js" />
<link rel="modulepreload" href="./src/ui/controls/section.js" />
<link rel="modulepreload" href="./src/ui/controls/select.js" />
<link rel="modulepreload" href="./src/ui/controls/shapeToggleGrid.js" />
<link rel="modulepreload" href="./src/ui/controls/slider.js" />
<link rel="modulepreload" href="./src/ui/controls/toggleSwitch.js" />
<link rel="modulepreload" href="./src/ui/customCursor.js" />
<link rel="modulepreload" href="./src/ui/drawCanvas.js" />
<link rel="modulepreload" href="./src/ui/dynamicLogo.js" />
<link rel="modulepreload" href="./src/ui/module-switcher.js" />
<link rel="modulepreload" href="./src/ui/toolbarIcons.js" />
<link rel="modulepreload" href="./src/ui/viewTransition.js" />
</head>
<body>
<header class="app-header">
  <div class="brand">
    <h1 class="visually-hidden">Kata</h1>
    <div id="app-logo" class="app-logo"></div>
    <nav id="module-tabs-slot" class="header-tabs-slot" aria-label="Módulos"></nav>
  </div>
  <div id="lang-switcher" class="lang-switcher" role="group" aria-label="Idioma / Language"></div>
</header>
<main id="app"></main>
<noscript>
  <p style="padding:24px;font-family:system-ui,sans-serif;color:#f1eec0;background:#0a0a0a;margin:0">
    O Kata precisa de JavaScript pra gerar os padrões. / Kata needs JavaScript to generate patterns.
  </p>
</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
